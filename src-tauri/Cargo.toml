[package]
name = "styx"
version = "1.0.0"
description = "Styx - Telegram sticker maker"
authors = ["threxal"]
edition = "2021"

[lib]
name = "styx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
oxipng = "9"
fast_image_resize = "5"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
kamadak-exif = "0.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
